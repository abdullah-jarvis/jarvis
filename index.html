<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #050b12;
      color: #00eaff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .jarvis {
      width: 92%;
      max-width: 700px;
      text-align: center;
      padding: 35px 20px;
    }

    h1 {
      font-size: 48px;
      letter-spacing: 8px;
      margin-bottom: 10px;
      text-shadow: 0 0 20px #00eaff;
    }

    .status {
      color: #8befff;
      margin-bottom: 30px;
    }

    .circle {
      width: 220px;
      height: 220px;
      margin: auto;
      border: 3px solid #00eaff;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow:
        0 0 25px #00eaff,
        inset 0 0 30px #006bff;
      animation: pulse 2s infinite;
    }

    .core {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #00eaff;
      box-shadow: 0 0 40px #00eaff;
    }

    @keyframes pulse {
      50% {
        transform: scale(1.05);
      }
    }

    button {
      margin-top: 35px;
      padding: 15px 35px;
      border: 2px solid #00eaff;
      border-radius: 30px;
      background: transparent;
      color: #00eaff;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 0 15px #00eaff;
    }

    button:hover {
      background: #00eaff;
      color: #050b12;
    }

    #output {
      margin-top: 30px;
      min-height: 70px;
      font-size: 18px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="jarvis">
    <h1>JARVIS</h1>

    <div class="status" id="status">
      SYSTEM ONLINE
    </div>

    <div class="circle">
      <div class="core"></div>
    </div>

    <button onclick="activateJarvis()">
      ACTIVATE JARVIS
    </button>

    <div id="output">
      Press the button and say: "Jarvis"
    </div>
  </div>

  <script>
    const output = document.getElementById("output");
    const statusText = document.getElementById("status");

    function speak(text) {
      const speech = new SpeechSynthesisUtterance(text);

      speech.lang = "en-US";
      speech.rate = 0.95;
      speech.pitch = 1;

      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(speech);
    }

    function activateJarvis() {

      output.innerHTML = "🎙️ Listening...";
      statusText.innerHTML = "LISTENING";

      speak("Hello. Jarvis is now active. How can I help you?");

      const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        output.innerHTML =
          "Voice recognition is not supported in this browser.";
        return;
      }

      const recognition = new SpeechRecognition();

      recognition.lang = "en-US";
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.start();

      recognition.onresult = function(event) {

        const command =
          event.results[0][0].transcript.toLowerCase();

        output.innerHTML =
          "You said: <b>" + command + "</b>";

        statusText.innerHTML = "PROCESSING";

        handleCommand(command);
      };

      recognition.onerror = function() {
        output.innerHTML =
          "I couldn't hear you. Please try again.";
        statusText.innerHTML = "SYSTEM ONLINE";
      };
    }

    function handleCommand(command) {

      if (command.includes("hello") ||
          command.includes("hi") ||
          command.includes("salam")) {

        speak("Hello sir. How are you?");
      }

      else if (command.includes("who are you")) {

        speak("I am Jarvis, your personal AI assistant.");
      }

      else if (command.includes("time")) {

        const time =
          new Date().toLocaleTimeString();

        speak("Sir, the time is " + time);
      }

      else if (command.includes("open youtube")) {

        speak("Opening YouTube.");
        window.open("https://www.youtube.com", "_blank");
      }

      else if (command.includes("open google")) {

        speak("Opening Google.");
        window.open("https://www.google.com", "_blank");
      }

      else if (command.includes("thank you")) {

        speak("You're welcome, sir.");
      }

      else {

        speak(
          "I heard you say " +
          command +
          ". I am still learning."
        );
      }

      statusText.innerHTML = "SYSTEM ONLINE";
    }
  </script>

</body>
</html>
