<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #02050a;
      color: #00eaff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .container {
      width: 92%;
      max-width: 700px;
      text-align: center;
    }

    h1 {
      font-size: 48px;
      letter-spacing: 8px;
      margin-bottom: 10px;
      text-shadow: 0 0 20px #00eaff;
    }

    .status {
      color: #7ffcff;
      margin-bottom: 35px;
    }

    .core {
      width: 190px;
      height: 190px;
      margin: 0 auto 35px;
      border-radius: 50%;
      border: 3px solid #00eaff;
      box-shadow:
        0 0 20px #00eaff,
        0 0 60px #007bff,
        inset 0 0 30px #00eaff;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 2s infinite;
    }

    .core span {
      font-size: 25px;
      font-weight: bold;
      text-shadow: 0 0 15px #00eaff;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.08);
      }
    }

    .output {
      min-height: 90px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid #00eaff;
      border-radius: 12px;
      background: rgba(0, 234, 255, 0.05);
      box-shadow: 0 0 15px rgba(0,234,255,.2);
      color: white;
      line-height: 1.6;
    }

    .controls {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #00eaff;
      background: #050b12;
      color: white;
      outline: none;
      font-size: 16px;
    }

    button {
      padding: 15px 18px;
      border: 1px solid #00eaff;
      border-radius: 10px;
      background: #03131b;
      color: #00eaff;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #00eaff;
      color: #001016;
      box-shadow: 0 0 20px #00eaff;
    }

    .mic {
      margin-top: 15px;
      width: 100%;
    }

    .listening {
      color: #00ff88;
      text-shadow: 0 0 15px #00ff88;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>JARVIS</h1>

    <div class="status" id="status">
      AI SYSTEM ONLINE
    </div>

    <div class="core">
      <span>J</span>
    </div>

    <div class="output" id="output">
      Hello! I am JARVIS. How can I help you?
    </div>

    <div class="controls">
      <input
        id="command"
        type="text"
        placeholder="Ask JARVIS anything..."
        autocomplete="off"
      >

      <button onclick="sendCommand()">SEND</button>
    </div>

    <button class="mic" onclick="startListening()">
      🎤 TALK TO JARVIS
    </button>

  </div>

<script>

const output = document.getElementById("output");
const commandInput = document.getElementById("command");
const statusText = document.getElementById("status");

function speak(text) {
  if (!("speechSynthesis" in window)) return;

  window.speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(text);

  speech.lang = /[\u0600-\u06FF]/.test(text)
    ? "ur-PK"
    : "en-US";

  speech.rate = 1;
  speech.pitch = 1;

  window.speechSynthesis.speak(speech);
}

function show(text) {
  output.innerText = text;
}

function openYouTube() {
  window.open("https://www.youtube.com", "_blank");
}

function openGoogle() {
  window.open("https://www.google.com", "_blank");
}

function searchYouTube(query) {
  const url =
    "https://www.youtube.com/results?search_query=" +
    encodeURIComponent(query);

  window.open(url, "_blank");
}

function searchGoogle(query) {
  const url =
    "https://www.google.com/search?q=" +
    encodeURIComponent(query);

  window.open(url, "_blank");
}

async function askAI(message) {

  statusText.innerText = "JARVIS IS THINKING...";

  show("Thinking... 🤖");

  try {

    const response = await fetch("/api/chat", {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        message: message
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "AI request failed");
    }

    const reply = data.reply || "Sorry, I could not answer that.";

    show(reply);
    speak(reply);

    statusText.innerText = "AI SYSTEM ONLINE";

  } catch (error) {

    console.error(error);

    const message =
      "Sorry bhai, AI connection mein problem aa rahi hai.";

    show(message);
    speak(message);

    statusText.innerText = "CONNECTION ERROR";
  }
}

async function processCommand(command) {

  const text = command.trim();
  const lower = text.toLowerCase();

  if (!text) return;

  show("You: " + text);

  // YouTube
  if (
    lower === "open youtube" ||
    lower === "youtube kholo" ||
    lower === "youtube open karo"
  ) {
    const reply = "Opening YouTube.";

    show(reply);
    speak(reply);
    openYouTube();
    return;
  }

  // YouTube search
  if (
    lower.startsWith("search youtube for ") ||
    lower.startsWith("youtube search ")
  ) {

    let query = "";

    if (lower.startsWith("search youtube for ")) {
      query = text.substring(19);
    } else {
      query = text.substring(15);
    }

    const reply = "Searching YouTube for " + query;

    show(reply);
    speak(reply);

    searchYouTube(query);
    return;
  }

  // Google
  if (
    lower === "open google" ||
    lower === "google kholo" ||
    lower === "google open karo"
  ) {
    const reply = "Opening Google.";

    show(reply);
    speak(reply);
    openGoogle();
    return;
  }

  // Google search
  if (
    lower.startsWith("search google for ")
  ) {

    const query = text.substring(18);

    const reply = "Searching Google for " + query;

    show(reply);
    speak(reply);

    searchGoogle(query);
    return;
  }

  // Time
  if (
    lower === "what time is it" ||
    lower === "time kya hai" ||
    lower === "waqt kya hai"
  ) {

    const now = new Date();

    const time = now.toLocaleTimeString([], {
      hour: "2-digit",
      minute: "2-digit"
    });

    const reply = "The current time is " + time;

    show(reply);
    speak(reply);
    return;
  }

  // Everything else → AI
  await askAI(text);
}

function sendCommand() {

  const command = commandInput.value.trim();

  if (!command) return;

  commandInput.value = "";

  processCommand(command);
}

commandInput.addEventListener("keydown", function(event) {

  if (event.key === "Enter") {
    sendCommand();
  }

});


// Voice Recognition

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let recognition;

if (SpeechRecognition) {

  recognition = new SpeechRecognition();

  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.lang = "en-US";

  recognition.onstart = function() {

    statusText.innerText = "LISTENING... 🎤";
    statusText.classList.add("listening");

  };

  recognition.onend = function() {

    statusText.innerText = "AI SYSTEM ONLINE";
    statusText.classList.remove("listening");

  };

  recognition.onerror = function(event) {

    console.error(event.error);

    statusText.innerText = "VOICE ERROR";

  };

  recognition.onresult = function(event) {

    const text =
      event.results[0][0].transcript;

    commandInput.value = text;

    processCommand(text);

  };

} else {

  console.log("Speech recognition is not supported.");
}

function startListening() {

  if (!recognition) {

    alert(
      "Voice recognition is not supported in this browser."
    );

    return;
  }

  recognition.start();
}

</script>

</body>
</html>
